services:
  - type: web
    name: glowwithsh-preview
    runtime: docker
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PREVIEW_MODE
        value: "true"
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_AUTH_SECRET
        generateValue: true
      - key: RAZORPAY_MODE
        value: test
