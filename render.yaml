services:
  - type: web
    name: glowwithsh
    runtime: docker
    healthCheckPath: /api/health
    disk:
      name: glowwithsh-data
      mountPath: /app/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_AUTH_SECRET
        generateValue: true
      - key: RAZORPAY_MODE
        value: live
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: SITE_GSTIN
        sync: false
      - key: APP_URL
        sync: false
      - key: ADMIN_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_SEO_MODEL
        value: gemini-2.5-flash-lite
